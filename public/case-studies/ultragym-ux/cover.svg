<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c2b22"/>
      <stop offset="1" stop-color="#0c0b09"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a42"/>
      <stop offset="1" stop-color="#c05e0c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="800" fill="url(#bg)"/>

  <!-- phone silhouette -->
  <rect x="180" y="90" width="280" height="620" rx="42" fill="#141210" stroke="#3a331f" stroke-width="2"/>
  <rect x="198" y="118" width="244" height="564" rx="20" fill="#1c1911"/>

  <!-- status/nav -->
  <circle cx="222" cy="146" r="10" fill="#f6efe1" opacity="0.15"/>
  <rect x="242" y="140" width="90" height="12" rx="6" fill="#f6efe1" opacity="0.15"/>

  <!-- hero gradient card: guided workout generation -->
  <rect x="216" y="176" width="208" height="120" rx="18" fill="url(#card)"/>
  <rect x="234" y="200" width="120" height="10" rx="5" fill="#0c0b09" opacity="0.35"/>
  <rect x="234" y="220" width="80" height="8" rx="4" fill="#0c0b09" opacity="0.25"/>
  <rect x="234" y="262" width="70" height="20" rx="10" fill="#0c0b09" opacity="0.3"/>

  <!-- exercise rows: flexible set editing -->
  <g opacity="0.9">
    <rect x="216" y="312" width="208" height="46" rx="12" fill="#262115"/>
    <circle cx="238" cy="335" r="12" fill="#8fdcae"/>
    <rect x="260" y="326" width="86" height="8" rx="4" fill="#f6efe1" opacity="0.5"/>
    <rect x="260" y="340" width="56" height="6" rx="3" fill="#f6efe1" opacity="0.25"/>
    <rect x="384" y="328" width="26" height="18" rx="6" fill="#ff9a42" opacity="0.85"/>
  </g>
  <g opacity="0.9">
    <rect x="216" y="366" width="208" height="46" rx="12" fill="#262115"/>
    <circle cx="238" cy="389" r="12" fill="#8fdcae"/>
    <rect x="260" y="380" width="100" height="8" rx="4" fill="#f6efe1" opacity="0.5"/>
    <rect x="260" y="394" width="60" height="6" rx="3" fill="#f6efe1" opacity="0.25"/>
    <rect x="384" y="382" width="26" height="18" rx="6" fill="#ff9a42" opacity="0.85"/>
  </g>

  <!-- performance intelligence: chart -->
  <rect x="216" y="428" width="208" height="110" rx="16" fill="#1c1911" stroke="#2b2519"/>
  <polyline points="230,510 262,486 294,498 326,462 358,470 390,440 410,450" fill="none" stroke="#8fdcae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="410" cy="450" r="5" fill="#8fdcae"/>

  <!-- buddy mode: two avatars -->
  <g>
    <circle cx="250" cy="590" r="22" fill="#3a2a15" stroke="#ff9a42" stroke-width="2"/>
    <circle cx="288" cy="590" r="22" fill="#1c2b22" stroke="#8fdcae" stroke-width="2"/>
    <rect x="230" y="624" width="176" height="14" rx="7" fill="#f6efe1" opacity="0.12"/>
  </g>

  <!-- floating paw badge (cat motif) -->
  <g transform="translate(468 250)">
    <circle r="46" fill="#161410" stroke="#3a331f" stroke-width="2"/>
    <g fill="#ff9a42">
      <ellipse cx="0" cy="10" rx="16" ry="14"/>
      <ellipse cx="-18" cy="-8" rx="7" ry="8"/>
      <ellipse cx="18" cy="-8" rx="7" ry="8"/>
      <ellipse cx="-8" cy="-18" rx="6" ry="7.5"/>
      <ellipse cx="8" cy="-18" rx="6" ry="7.5"/>
    </g>
  </g>

  <!-- floating dot accents -->
  <circle cx="140" cy="150" r="4" fill="#8fdcae" opacity="0.6"/>
  <circle cx="500" cy="560" r="5" fill="#ff9a42" opacity="0.5"/>
  <circle cx="120" cy="620" r="3" fill="#f6efe1" opacity="0.3"/>
</svg>
